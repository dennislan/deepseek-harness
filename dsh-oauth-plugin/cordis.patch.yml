# dsh-oauth bundle patch
#
# One row: the host half provides ctx.auth + /api/auth/* routes and mounts
# the client half (the premium split-screen login overlay) via its dsh.client
# declaration. Disabled by default so the profile can enable it selectively.
#
# To enable from your profile's cordis.patch.yml:
#
#   - id: dsh-oauth-host
#     disabled: false
#     config:
#       apiUrl: 'https://auth.example.com'
#       wechatEnabled: true        # optional
#       wechatApiUrl: 'https://open.weixin.qq.com/connect'

- insert:
    - id: dsh-oauth-host
      name: 'dsh-oauth'
      disabled: true
      config: {}
