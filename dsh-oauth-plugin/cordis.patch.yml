# dsh-oauth bundle patch
#
# One row: the host half provides ctx.auth + /api/auth/* routes and mounts
# the client half (the premium split-screen login overlay) via its dsh.client
# declaration. Disabled by default so the profile can enable it selectively.
#
# To enable from your profile's cordis.patch.yml:
#
#   - id: dsh-oauth-host
#     disabled: false
#     config:
#       apiUrl: 'https://auth.example.com'
#       wechatEnabled: true              # optional; official WeChat Website-App OAuth
#       wechatAppId: 'wx...'             # 开放平台 网站应用 AppID
#       wechatAppSecret: '...'           # 开放平台 AppSecret (服务端专用, 绝不出现在前端)
#       wechatRedirectUri: 'http://127.0.0.1:3080/api/auth/wechat/callback'  # 需在开放平台配置为授权回调域
#       wechatStateTtlMs: 600000         # 一次性 state 有效期 (默认 10 分钟)

- insert:
    - id: dsh-oauth-host
      name: 'dsh-oauth'
      disabled: true
      config: {}
